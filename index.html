<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:#111;font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;font-size:15px}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:2px}
input,textarea,button{font-family:'Inter',sans-serif}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.5}

/* ── COLOR TOKENS ── */
:root{
  --orange: #FC4C02;     /* Strava signature */
  --orange-l: #FFF0EB;   /* Strava light */
  --green:  #00B37E;     /* Wellhub recovery */
  --green-l: #E6FBF4;
  --coral:  #FF6B6B;     /* High intensity */
  --coral-l: #FFF0F0;
  --violet: #7C3AED;     /* Long run */
  --violet-l: #F3EFFF;
  --amber:  #F59E0B;     /* Gym/strength */
  --amber-l: #FFFBEB;
  --gray:   #6B7280;     /* Rest */
  --gray-l: #F9FAFB;
  --ink:    #111827;     /* Primary text */
  --ink2:   #4B5563;     /* Secondary */
  --ink3:   #9CA3AF;     /* Tertiary */
  --border: #E5E7EB;
  --border2:#F3F4F6;
  --surface:#FFFFFF;
  --bg:     #F9FAFB;
}

/* ── CARDS ── */
.card{background:#fff;border:1.5px solid var(--border);border-radius:16px;transition:box-shadow .15s}
.card-tap{cursor:pointer;transition:all .15s}
.card-tap:active{transform:scale(.98)}

/* ── TYPE ── */
.h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;color:var(--ink)}
.h2{font-size:17px;font-weight:700;color:var(--ink)}
.h3{font-size:14px;font-weight:600;color:var(--ink)}
.body{font-size:13px;color:var(--ink2);line-height:1.6}
.caption{font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}

/* ── PROGRESS ── */
.progress-track{height:6px;background:var(--border2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}

/* ── BUTTONS ── */
.btn-primary{background:var(--orange);color:#fff;border:none;border-radius:12px;padding:14px 20px;font-weight:700;font-size:14px;cursor:pointer;width:100%;transition:all .15s}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{background:transparent;border:1.5px solid var(--border);border-radius:10px;padding:10px 16px;font-weight:500;font-size:13px;cursor:pointer;color:var(--ink2);transition:all .15s}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange)}

/* ── NAV ── */
.nav-tab{flex:1;padding:8px 4px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .15s}

/* ── ANIMATIONS ── */
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.slideUp{animation:slideUp .2s ease}
.fadeIn{animation:fadeIn .18s ease}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheetIn{animation:sheetIn .25s cubic-bezier(.32,.72,0,1)}

/* ── GRID ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── WEEK GRID ── */
.day-cell{border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all .15s;position:relative;border:1.5px solid var(--border);background:#fff;min-height:70px}
.day-cell:active{transform:scale(.95)}
.day-cell.selected{box-shadow:0 0 0 2.5px currentColor}
.day-cell.done{border-width:2px}

/* TIP BOX */
.tip-box{border-radius:16px;padding:16px;border-left:4px solid;margin-bottom:0}

<script type="text/babel" data-presets="react">

// ── STORAGE ────────────────────────────────────────────────────────────────────

function getTip(wkType, week) {
  const pool = TIPS[wkType] || TIPS.rest;
  // Rotate tip based on week to vary them
  return pool[week % pool.length];
}

const PLAN=buildPlan();
const planKmWeek=w=>Object.values(PLAN[w]||{}).reduce((s,d)=>s+(d.km||0),0);
const doneKmWeek=(w,done)=>Object.entries(PLAN[w]||{}).reduce((s,[d])=>done[`${w}-${d}`]?s+(PLAN[w][d].km||0):s,0);
const totalPlanKm=Array.from({length:20},(_,i)=>i+1).reduce((s,w)=>s+planKmWeek(w),0);

// ── STRAVA ────────────────────────────────────────────────────────────────────
const CLIENT_ID="214998";
const REDIRECT=()=>window.location.href.split("?")[0].split("#")[0];
const stravaUrl=()=>`https://www.strava.com/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT())}&response_type=code&scope=activity:read_all&state=paulav3`;
const fmtPace=mps=>{if(!mps)return"--";const s=1/mps*1000/60;const m=Math.floor(s);const ss=Math.round((s-m)*60);return`${m}:${String(ss).padStart(2,"0")}`;};
const fmtDist=m=>(m/1000).toFixed(1)+"km";

function App(){
  const [week,setWeek]=useState(1);

  const [secretVal,setSecretVal]=useState("");

  useEffect(()=>{
    (async()=>{
      const [d,n,m]=await Promise.all([Cloud.get("done"),Cloud.get("notes"),Cloud.get("meta")]);
      if(d)setDoneRaw(d); if(n)setNotesRaw(n);
      if(m?.start&&!planStart){LS.set("pv3_start",m.start);setPlanStart(m.start);}
    })();
  },[]);

  useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    const code=p.get("code"),state=p.get("state");
    if(code&&state==="paulav3"){
      window.history.replaceState({},"",window.location.pathname);
      const sd=LS.get("pv3_str");
      if(sd?.secret)doExchange(code,sd.secret);
      else setSecretOpen({code});
    }
  },[]);

  useEffect(()=>{
    if(!planStart)return;
    const diff=Math.floor((new Date()-new Date(planStart))/86400000);
    setWeek(Math.max(1,Math.min(20,Math.floor(diff/7)+1)));
  },[planStart]);

  const saveDone=async nd=>{setDoneRaw(nd);await Cloud.set("done",nd);};
  const saveNotes=async nn=>{setNotesRaw(nn);await Cloud.set("notes",nn);};

  async function toggleDone(w,d){
    const k=`${w}-${d}`;const n={...done};
    n[k]?delete n[k]:(n[k]={manual:true,ts:Date.now()});
    await saveDone(n);
  }

  async function doExchange(code,secret){
    setSyncing(true);setSyncMsg("Conectando...");
    try{
      const r=await fetch("https://www.strava.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_id:CLIENT_ID,client_secret:secret,code,grant_type:"authorization_code"})});
      const data=await r.json();
      const sd={at:data.access_token,rt:data.refresh_token,exp:data.expires_at,secret,athlete:data.athlete};
      LS.set("pv3_str",sd);setStrava(sd);
      await syncActs(data.access_token);
    }catch{setSyncMsg("❌ Verifica el Client Secret");}
    setSyncing(false);setSecretOpen(null);
  }

  async function syncActs(tokenOverride){
    setSyncing(true);setSyncMsg("Sincronizando Strava...");
    try{
      let sd=LS.get("pv3_str");let token=tokenOverride||sd?.at;
      if(sd&&Date.now()/1000>sd.exp-60){
        const r=await fetch("https://www.strava.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_id:CLIENT_ID,client_secret:sd.secret,refresh_token:sd.rt,grant_type:"refresh_token"})});
        const data=await r.json();token=data.access_token;
        const upd={...sd,at:data.access_token,rt:data.refresh_token,exp:data.expires_at};
        LS.set("pv3_str",upd);setStrava(upd);
      }
      let all=[],page=1,batch;
      do{const r=await fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=100&page=${page}`,{headers:{Authorization:`Bearer ${token}`}});batch=await r.json();all=[...all,...batch];page++;}while(batch.length===100);
      const runs=all.filter(a=>a.type==="Run"||a.type==="TrailRun");
      setActs(runs);
      if(planStart)autoMark(runs);
      setSyncMsg(`✓ ${runs.length} carreras`);
      setTimeout(()=>setSyncMsg(""),3000);
    }catch{setSyncMsg("❌ Error al sincronizar");}
    setSyncing(false);
  }

  function autoMark(activities){
    const start=new Date(planStart);const nd={...done};
    activities.forEach(act=>{
      const ad=new Date(act.start_date_local);
      const diff=Math.floor((ad-start)/86400000);
      if(diff<0)return;
      const w=Math.floor(diff/7)+1,d=(ad.getDay()+6)%7+1;
      if(w>=1&&w<=20&&PLAN[w]?.[d]&&["run","recovery","speed","long","race"].includes(PLAN[w][d].wk))
        nd[`${w}-${d}`]={auto:true,id:act.id,name:act.name,dist:act.distance,time:act.moving_time,pace:act.average_speed,hr:act.average_heartrate,elev:act.total_elevation_gain};
    });
    saveDone(nd);
  }

  // Derived
  const phase=getPhase(week);
  const weekDays=PLAN[week]||{};
  const totalKmDone=Array.from({length:20},(_,i)=>i+1).reduce((s,w)=>s+doneKmWeek(w,done),0);
  const totalSess=Array.from({length:20},(_,i)=>i+1).reduce((s,w)=>s+Object.keys(PLAN[w]||{}).length,0);
  const doneSess=Object.values(done).filter(Boolean).length;
  const adherence=totalSess>0?Math.round((doneSess/totalSess)*100):0;
  const avgPace=acts.length?acts.reduce((s,a)=>s+a.average_speed,0)/acts.length:null;
  const wkKmDone=doneKmWeek(week,done);
  const wkKmPlan=planKmWeek(week);
  const selData=selDay&&PLAN[week]?.[selDay];
  const selKey=selDay?`${week}-${selDay}`:null;
  const selDone=selKey&&done[selKey];
  const selWK=selData?WK[selData.wk]||WK.rest:null;

          <input type="password" value={secretVal} onChange={e=>setSecretVal(e.target.value)} placeholder="Pega tu Client Secret aquí"
            style={{width:"100%",padding:"13px 14px",borderRadius:10,border:"1.5px solid var(--border)",fontSize:14,outline:"none",marginBottom:10,color:"var(--ink)"}}/>

          {syncMsg&&<p style={{marginTop:8,fontSize:12,color:"var(--green)",textAlign:"center"}}>{syncMsg}</p>}
        </ModalSheet>
      )}

      {/* DATE PICKER */}
      {datePicker&&(

          <p className="body" style={{marginBottom:16}}>Esto determina en qué semana estás automáticamente.</p>
          <input type="date" id="dpick" defaultValue={planStart||new Date().toISOString().split("T")[0]}
            style={{width:"100%",padding:"13px 14px",borderRadius:10,border:"1.5px solid var(--border)",fontSize:14,outline:"none",marginBottom:10,color:"var(--ink)"}}/>
          <button className="btn-primary" onClick={async()=>{
            const v=document.getElementById("dpick").value;if(!v)return;
            LS.set("pv3_start",v);setPlanStart(v);
            await Cloud.set("meta",{start:v});
            setDatePicker(false);
          }}>Guardar fecha de inicio</button>
        </ModalSheet>
      )}

      {/* ── HEADER ── */}
      <div style={{background:"#fff",borderBottom:"1.5px solid var(--border)",padding:"14px 16px 10px",position:"sticky",top:0,zIndex:50}}>

                <p className="body" style={{marginBottom:16}}>El combustible extra para runs de más de 75 minutos.</p>
                {[
                  {title:"¿Cuándo necesitas gel?",color:"var(--green)",items:["Runs de MÁS de 75 minutos","Tu cuerpo tiene glucógeno para ~60-75min","Sin gel en runs largos: el 'muro' aparece","En la carrera (21km a 5:41/km) tardarás ~2h → geles obligatorios"]},
                  {title:"Semanas 1-7 — sin geles",color:"var(--amber)",items:["Long runs menores de 75min","Deja que el cuerpo use sus reservas","Beneficio: entrenas eficiencia metabólica"]},
                  {title:"Semana 8+ — introducir gel",color:"var(--orange)",items:["Primer gel en km 8 del long run","SIEMPRE con agua — sin agua puede molestar","Practica en entrenamiento, nunca estrenes en carrera","Empieza con uno, luego dos, luego tres"]},
                  {title:"Plan de gel para carrera",color:"var(--coral)",items:["Gel 1: km 7 — antes de sentir que lo necesitas","Gel 2: km 14 — cuando más lo necesitarás","Agua en cada avituallamiento","Nunca cambies de marca el día de carrera"]},
                  {title:"¿Qué marca?",color:"var(--violet)",items:["Maurten 100 — muy suave, sin sabor artificial (más caro)","SIS Go Gel — buena relación calidad/precio","Evita geles con cafeína las primeras veces","Prueba 2-3 marcas en training y quédate con la mejor"]},
                ].map(s=>(
                  <div key={s.title} className="card" style={{padding:"12px 14px",marginBottom:10,borderLeft:`3px solid ${s.color}`}}>
                    <div style={{fontSize:10,fontWeight:700,color:s.color,textTransform:"uppercase",letterSpacing:.4,marginBottom:8}}>{s.title}</div>
                    {s.items.map((x,i)=><BulletLine key={i} color={s.color}>{x}</BulletLine>)}
                  </div>
                ))}
              </div>
            )}

            {guideTab==="recovery"&&(
              <div>
                <p className="h2" style={{marginBottom:4}}>Recovery</p>
                <p className="body" style={{marginBottom:16}}>El entrenamiento más infravalorado.</p>
                {[
                  {title:"Sueño — lo más importante",color:"var(--violet)",items:["7-8h mínimo en días normales","8-9h en semanas de pico si puedes","Durante el sueño se libera hormona de crecimiento — aquí mejoras","Sin sueño: mismo pace se siente más duro y más riesgo de lesión"]},
                  {title:"Masajes de descarga",color:"var(--green)",items:["Fases 1-2: 1 masaje cada 3-4 semanas","Fase 3 (pico): cada 2 semanas","Semana antes de carrera: masaje SUAVE (no profundo)","Pide: masaje deportivo de descarga + drenaje linfático"]},
                  {title:"Chaleco con peso",color:"var(--amber)",items:["Semanas 1-8: NO — el cuerpo se adapta al volumen","Semana 9+: empieza con 1-2kg en rodajes fáciles","NUNCA en speedwork ni long runs","Si tu pace baja +30s/km: demasiado peso"]},
                  {title:"Señales de sobreentrenamiento",color:"var(--coral)",items:["Sueño perturbado sin razón aparente","Fatiga que no desaparece con descanso","Rendimiento que baja aunque entrenes más","Si tienes 3 de estos: semana de descarga obligatoria"]},
                ].map(s=>(
                  <div key={s.title} className="card" style={{padding:"12px 14px",marginBottom:10,borderLeft:`3px solid ${s.color}`}}>
                    <div style={{fontSize:10,fontWeight:700,color:s.color,textTransform:"uppercase",letterSpacing:.4,marginBottom:8}}>{s.title}</div>
                    {s.items.map((x,i)=><BulletLine key={i} color={s.color}>{x}</BulletLine>)}
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:"1.5px solid var(--border)",padding:"6px 0 10px",zIndex:50}}>
        <div style={{maxWidth:500,margin:"0 auto",display:"flex"}}>
          {[["plan","📅","Plan"],["strava","⚡","Strava"],["guide","📚","Guías"]].map(([s,ic,lb])=>(
            <button key={s} className="nav-tab" onClick={()=>{setScreen(s);setSelDay(null);}}>
              <span style={{fontSize:20}}>{ic}</span>
              <span style={{fontSize:10,color:screen===s?"var(--orange)":"var(--ink3)",fontWeight:screen===s?700:400}}>{lb}</span>
              {screen===s&&<div style={{width:20,height:2.5,background:"var(--orange)",borderRadius:2}}/>}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── COMPONENTS ─────────────────────────────────────────────────────────────────
function Box({color,light,icon,title,tag,children}){
  return(
    <div className="card" style={{padding:"12px",overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
        <span style={{fontSize:16}}>{icon}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:10,fontWeight:700,color,textTransform:"uppercase",letterSpacing:.4}}>{tag}</div>
          <div style={{fontSize:12,fontWeight:600,color:"var(--ink)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{title}</div>
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:4}}>{children}</div>
    </div>
  );
}
function BulletLine({color,children}){
  return(
    <div style={{display:"flex",alignItems:"flex-start",gap:6}}>
      <div style={{width:4,height:4,borderRadius:"50%",background:color,marginTop:4.5,flexShrink:0}}/>
      <span style={{fontSize:11,color:"var(--ink2)",lineHeight:1.5}}>{children}</span>
    </div>
  );
}
function ModalSheet({children,onClose}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200,backdropFilter:"blur(4px)"}} onClick={onClose}>
      <div style={{width:"100%",maxWidth:500,background:"#fff",borderRadius:"20px 20px 0 0",padding:"20px 16px 32px",maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{width:36,height:4,background:"var(--border)",borderRadius:2,margin:"0 auto 18px"}}/>
        {children}
      </div>
    </div>
  );
}
function GuideList({title,subtitle,items}){
  return(
    <div>
      <p className="h2" style={{marginBottom:4}}>{title}</p>
      <p className="body" style={{marginBottom:16}}>{subtitle}</p>
      {items.map(it=>(
        <div key={it.title} className="card" style={{padding:"12px 14px",marginBottom:8,display:"flex",gap:12,alignItems:"flex-start"}}>
          <div style={{fontSize:20,flexShrink:0}}>{it.icon}</div>
          <div style={{flex:1}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6}}>
              <div style={{fontSize:13,fontWeight:600,color:"var(--ink)"}}>{it.title}</div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2,flexShrink:0}}>
                <span style={{fontSize:9,fontWeight:600,color:"var(--ink3)",background:"var(--bg)",padding:"2px 7px",borderRadius:4}}>{it.time}</span>
                {it.tag&&<span style={{fontSize:9}}>{it.tag}</span>}
              </div>
            </div>
            <div className="body" style={{marginTop:4,fontSize:12}}>{it.desc}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
